    /* Beams around the cards */
    @property --beam-angle { syntax: "<angle>"; inherits: false; initial-value: 0deg; }
    .card { --beam-a: #fff; --beam-b: #ffc2d4; --beam-c: #ff6796; --beam-speed: 7s; --beam-delay: 0s; }
    .card--left { --beam-c: #b58cff; --beam-b: #f3c4ff; --beam-delay: -2.4s; }
    .card--right { --beam-c: #ffab40; --beam-b: #fff1a4; --beam-delay: -4.8s; }
    .card::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 8;
      padding: 2.4px;
      border-radius: inherit;
      pointer-events: none;
      background: conic-gradient(from var(--beam-angle), transparent 0turn, transparent .64turn, var(--beam-c) .84turn, var(--beam-b) .93turn, var(--beam-a) .972turn, var(--beam-a) .99turn, transparent 1turn);
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
      mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0);
      animation: beam-travel var(--beam-speed) linear infinite;
      animation-delay: var(--beam-delay);

    .reveal .line:nth-child(2) { animation-delay: .09s; }
    .reveal .intro { animation: rise .72s cubic-bezier(.22, 1, .36, 1) .25s both; }
    .reveal .card { animation: establish .8s cubic-bezier(.16, 1, .3, 1) .4s both; }

    .lock.is-leaving { animation: leave .5s ease .45s both; }

    @keyframes headline { from { opacity: 0; transform: translateY(.5em); clip-path: inset(0 0 56% 0); } to { opacity: 1; transform: none; clip-path: inset(-8% -2% -8% -2%); } }
    @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    @keyframes establish { from { opacity: 0; transform: translateY(18px) scale(.975); } to { opacity: 1; transform: none; } }
    @keyframes float { 0%, 100% { translate: 0 0; } 50% { translate: 0 -10px; } }
    @keyframes twinkle { from { opacity: 0; transform: scale(.4); } to { opacity: 1; transform: none; } }
    @keyframes pulse { 0%, 100% { opacity: .25; transform: scale(.8); } 50% { opacity: 1; transform: none; } }
    @keyframes shake { 10%, 90% { translate: -2px 0; } 20%, 80% { translate: 4px 0; } 30%, 50%, 70% { translate: -8px 0; } 40%, 60% { translate: 8px 0; } }
    @keyframes unlocked { to { transform: scale(1.04); } }
    @keyframes leave { to { opacity: 0; } }

    @media (max-width: 900px) {

    @media (prefers-reduced-motion: reduce) {

      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>

        });
        x += g[0].length * 4; cols += g[0].length;
        if (i < text.length - 1) { x += 4; cols += 1; }
      });
      el.style.width = (cols * 4.851 / 49).toFixed(3) + "em";
      el.innerHTML = '<svg viewBox="0 0 ' + x + ' 28" fill="currentColor">' + out + "</svg>";
    });
    const LOCK = [
      "0011111100",
      "0110000110",
      "0100000010",
      "0100000010",
      "1111111111",
      "1111111111",
      "1111001111",
      "1111001111",
      "1111111111",
      "1111111111",
    ];
    document.querySelectorAll("[data-lock]").forEach(function (el) {
      let shackle = "", body = "", n = 0;
      LOCK.forEach(function (row, y) {
        [...row].forEach(function (bit, x) {
          if (bit !== "1") return;
          const c = '<circle cx="' + (x * 10 + 5) + '" cy="' + (y * 10 + 5) + '" r="3.4" style="animation-delay:' + (0.9 + (n++) * 0.012).toFixed(3) + 's"/>';
          if (y < 4) shackle += c; else body += c;
        });
      });
      el.innerHTML = '<svg viewBox="0 0 100 100"><g class="shackle">' + shackle + "</g><g>" + body + "</g></svg>";
    });

    // Theme toggle, shared with the site.
    const themeBtn = document.getElementById("theme");
    function setThemeLabel() {
      const dark = document.documentElement.dataset.theme === "dark";
      themeBtn.setAttribute("aria-label", dark ? "Switch to light mode" : "Switch to dark mode");
      document.querySelector('meta[name="theme-color"]').setAttribute("content", dark ? "#121213" : "#ececeb");
    }
    themeBtn.addEventListener("click", function () {
      const next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
      document.documentElement.dataset.theme = next;
      try { localStorage.setItem("pact-founder-room:theme", next); } catch (e) {}
      setThemeLabel();
    });
    setThemeLabel();

    // Seamless loops: a twin copy crossfades in before the end, so the video never jumps back.
    const FADE = 1.6;
    function makeLoop(video) {
      video.loop = false;
      const twin = video.cloneNode(false);
      twin.muted = true;
      twin.playsInline = true;
      twin.style.opacity = "0";
      [video, twin].forEach(function (v) { v.style.transition = "opacity " + FADE + "s ease-in-out"; });
      video.after(twin);
      let front = video, back = twin, fading = false;
      const start = function (v) { const p = v.play(); if (p && p.catch) p.catch(function () {}); };
      [video, twin].forEach(function (v) {
        v.addEventListener("ended", function () { if (v === front && !fading) { v.currentTime = 0; start(v); } });
      });
      (function tick() {
        const d = front.duration;
        if (!fading && d && isFinite(d) && d > FADE * 2 && front.currentTime >= d - FADE) {
          fading = true;
          back.currentTime = 0;
          start(back);
          back.style.opacity = "1";
          front.style.opacity = "0";
          const outgoing = front;
          setTimeout(function () { outgoing.pause(); const t = front; front = back; back = t; fading = false; }, FADE * 1000 + 60);
        }
        requestAnimationFrame(tick);
      })();
      start(video);
    }
    if (!reducedMotion) {
      const mobile = window.matchMedia("(max-width: 767px)").matches;
      makeLoop(document.querySelector(mobile ? ".motion--narrow" : ".motion--wide"));
      makeLoop(document.querySelector(".card-video"));
    }

    window.onload = async function () {
      const { isSuccessful } = await staticrypt.handleDecryptOnLoad();
      if (isSuccessful) return;
      document.getElementById("staticrypt_loading").classList.add("hidden");
      const content = document.getElementById("staticrypt_content");
      content.classList.remove("hidden");
      content.classList.add("reveal");
      document.getElementById("staticrypt-password").focus();
      if (isRememberEnabled) document.getElementById("staticrypt-remember-label").classList.remove("hidden");
    };

    const eye = document.getElementById("eye");
    eye.addEventListener("click", function () {
      const input = document.getElementById("staticrypt-password");
      const show = input.type === "password";
      input.type = show ? "text" : "password";
      eye.setAttribute("aria-pressed", String(show));
      eye.setAttribute("aria-label", show ? templateToggleAltHide : templateToggleAltShow);
    });

    document.getElementById("staticrypt-form").addEventListener("submit", async function (e) {
      e.preventDefault();
      const card = document.getElementById("lock-card");
      const error = document.getElementById("lock-error");
      const btn = document.getElementById("open-btn");
      const password = document.getElementById("staticrypt-password").value;
      const remember = document.getElementById("staticrypt-remember").checked;
      error.textContent = "";
      card.classList.remove("is-wrong");
      const label = btn.textContent;
      btn.disabled = true;
      btn.textContent = "Checking…";
      userSubmitted = true;
      const { isSuccessful } = await staticrypt.handleDecryptionOfPage(password, remember);
      if (!isSuccessful) {
        userSubmitted = false;
        btn.disabled = false;
        btn.textContent = label;
        void card.offsetWidth;
        card.classList.add("is-wrong");
        error.textContent = templateError;
        const input = document.getElementById("staticrypt-password");
        input.select();
      }
    });
  </script>
</body>
</html>
