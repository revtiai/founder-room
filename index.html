        v.addEventListener("ended", function () { if (v === front && !fading) { v.currentTime = 0; start(v); } });
      });
      (function tick() {
        const d = front.duration;
        if (!fading && d && isFinite(d) && d > FADE * 2 && front.currentTime >= d - FADE) {
          fading = true;
          back.currentTime = 0;
          start(back);
          back.style.opacity = "1";
          front.style.opacity = "0";
          const outgoing = front;
          setTimeout(function () { outgoing.pause(); const t = front; front = back; back = t; fading = false; }, FADE * 1000 + 60);
        }
        requestAnimationFrame(tick);
      })();
      start(video);
    }
    if (!reducedMotion) {
      const mobile = window.matchMedia("(max-width: 767px)").matches;
      makeLoop(document.querySelector(mobile ? ".motion--narrow" : ".motion--wide"));
      makeLoop(document.querySelector(".card-video"));
    }

    window.onload = async function () {
      const { isSuccessful } = await staticrypt.handleDecryptOnLoad();
      if (isSuccessful) return;
      document.getElementById("staticrypt_loading").classList.add("hidden");
      const content = document.getElementById("staticrypt_content");
      content.classList.remove("hidden");
      content.classList.add("reveal");
      document.getElementById("staticrypt-password").focus();
      if (isRememberEnabled) document.getElementById("staticrypt-remember-label").classList.remove("hidden");
    };

    const eye = document.getElementById("eye");
    eye.addEventListener("click", function () {
      const input = document.getElementById("staticrypt-password");
      const show = input.type === "password";
      input.type = show ? "text" : "password";
      eye.setAttribute("aria-pressed", String(show));
      eye.setAttribute("aria-label", show ? templateToggleAltHide : templateToggleAltShow);
    });

    document.getElementById("staticrypt-form").addEventListener("submit", async function (e) {
      e.preventDefault();
      const card = document.getElementById("lock-card");
      const error = document.getElementById("lock-error");
      const btn = document.getElementById("open-btn");
      const password = document.getElementById("staticrypt-password").value;
      const remember = document.getElementById("staticrypt-remember").checked;
      error.textContent = "";
      card.classList.remove("is-wrong");
      const label = btn.textContent;
      btn.disabled = true;
      btn.textContent = "Checking…";
      userSubmitted = true;
      const { isSuccessful } = await staticrypt.handleDecryptionOfPage(password, remember);
      if (!isSuccessful) {
        userSubmitted = false;
        btn.disabled = false;
        btn.textContent = label;
        void card.offsetWidth;
        card.classList.add("is-wrong");
        error.textContent = templateError;
        const input = document.getElementById("staticrypt-password");
        input.select();
      }
    });
  </script>
</body>
</html>
