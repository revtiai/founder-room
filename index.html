    const GLYPHS = {

      q: ["00000", "00000", "01111", "10001", "01111", "00001", "00001"],
      u: ["00000", "00000", "10001", "10001", "10001", "10011", "01101"],

    document.querySelectorAll("[data-dots]").forEach(function (el) {

      const text = el.dataset.dots;
      [...text].forEach(function (ch, i) {
        const g = GLYPHS[ch];
        g.forEach(function (row, y) {
          [...row].forEach(function (bit, c) {
            if (bit === "1") out += '<circle cx="' + (x + c * 4 + 1.55) + '" cy="' + (y * 4 + 1.55) + '" r="1.8"/>';

    // Seamless loops: a twin copy crossfades in before the end, so the video never jumps back.
    const FADE = 1.6;
    function makeLoop(video) {
      video.loop = false;
      const twin = video.cloneNode(false);
      twin.muted = true;
      twin.playsInline = true;
      twin.style.opacity = "0";
      [video, twin].forEach(function (v) { v.style.transition = "opacity " + FADE + "s ease-in-out"; });
      video.after(twin);
      let front = video, back = twin, fading = false;
      const start = function (v) { const p = v.play(); if (p && p.catch) p.catch(function () {}); };

      });

        const d = front.duration;
        if (!fading && d && isFinite(d) && d > FADE * 2 && front.currentTime >= d - FADE) {
          fading = true;
          back.currentTime = 0;
          start(back);
          back.style.opacity = "1";
          front.style.opacity = "0";
          const outgoing = front;
          setTimeout(function () { outgoing.pause(); const t = front; front = back; back = t; fading = false; }, FADE * 1000 + 60);
        }
        requestAnimationFrame(tick);
      })();
      start(video);
    }
